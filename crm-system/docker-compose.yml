name: crm-system

services:
    postgres:
        image: postgres:16-alpine
        container_name: crm_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - crm_network
        logging:
            options:
                max-size: "10m"
                max-file: "3"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: crm_backend
        restart: unless-stopped
        env_file:
            - ./backend/.env
        environment:
            NODE_OPTIONS: "--max-old-space-size=512"
        ports:
            - "${BACKEND_PORT}:3001"
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./backend/src:/app/src
            - ./backend/prisma:/app/prisma
            - ./backend/prisma.config.ts:/app/prisma.config.ts
            - ./backend/.env:/app/.env
            - /app/dist
        networks:
            - crm_network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3001/api/health').then(() => process.exit(0)).catch(() => process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: crm_frontend
        restart: unless-stopped
        env_file:
            - ./frontend/.env
        ports:
            - "${FRONTEND_PORT}:3000"
        depends_on:
            - backend
        volumes:
            - ./frontend:/app
            - /app/node_modules
            - /app/build
        networks:
            - crm_network
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3000').then(() => process.exit(0)).catch(() => process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s

volumes:
    postgres_data:

networks:
    crm_network:
        driver: bridge
