name: CI/CD CRM

on:
  pull_request:
    branches: [develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:prisma@localhost:5433/postgres?schema=public
      BACKEND_PORT: 3001
      FRONTEND_PORT: 3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install
        working-directory: .

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ./crm-system/backend

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: ./crm-system/backend

      - name: Run backend tests
        run: npm test -- --run
        working-directory: ./crm-system/backend

      - name: Build frontend
        run: npm run build
        working-directory: ./crm-system/frontend

  build:
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4=77
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install
        working-directory: .

      - name: Build backend and frontend
        run: npm run build
        working-directory: .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            crm-system/backend/dist
            crm-system/frontend/build

  deploy-development:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    needs: test
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Deploy to Vercel (development)
        uses: nexterias/actions-vercel@v2
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: false
          prebuilt: false
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Deploy to Vercel (production)
        uses: nexterias/actions-vercel@v2
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: true
          prebuilt: false
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}